name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests, PHP ${{ matrix.php }}, ${{ matrix.dependencies }} deps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'
        dependencies:
          - lowest
          - highest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: vendor/bin/phpunit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      COVERAGE_FLOOR: '95'
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov

      - uses: ramsey/composer-install@v4

      - run: vendor/bin/phpunit --coverage-clover coverage.xml

      # The report goes out before the floor is checked, so a failed build tells the truth.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: true

      - name: Hold the coverage floor
        run: php .github/coverage.php coverage.xml "$COVERAGE_FLOOR"

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@v4

      - run: composer validate --strict

      - run: vendor/bin/phpstan analyse --no-progress

  # The ruleset requires this job alone: matrix names carry PHP versions and keep changing.
  gate:
    name: All checks
    runs-on: ubuntu-latest
    needs:
      - tests
      - coverage
      - static
    if: always()
    steps:
      - name: Refuse unless every job above succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
              if [ "$result" != success ]; then
                  echo "::error::A job did not succeed: $RESULTS"
                  exit 1
              fi
          done

          echo "Every job succeeded: $RESULTS"
