services:
  php83:
    build:
      context: docker
      args:
        PHP_VERSION: '8.3'
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_HOME: /tmp/composer-cache

  php84:
    build:
      context: docker
      args:
        PHP_VERSION: '8.4'
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_HOME: /tmp/composer-cache

  php85:
    build:
      context: docker
      args:
        PHP_VERSION: '8.5'
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_HOME: /tmp/composer-cache

volumes:
  composer-cache:
